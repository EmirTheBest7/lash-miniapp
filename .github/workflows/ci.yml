name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, unit tests
        run: npx tsc --noEmit && npm test
      - name: Production build (no mock, no gallery) + bundle budget + licenses
        run: npm run build && node scripts/check-size.mjs dist/assets && node scripts/check-licenses.mjs
        env:
          BUILD_ID: ${{ github.sha }}
      - name: Browser builds for the e2e run
        run: |
          VITE_MOCK=1 VITE_GALLERY=1 npx vite build --outDir dist-e2e
          VITE_MOCK=1 VITE_API_BASE_URL=https://api.example.test/api npx vite build --outDir dist-xo
      - run: npx playwright install --with-deps chromium
      - name: e2e (synthetic data only)
        run: npx playwright test
      - name: Screenshots for design review (synthetic)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7
